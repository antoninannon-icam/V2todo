<!doctype html>
<html>
<head>
<title>Connexion</title>
<meta charset="utf-8">
</head>
<body style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;">
    <h1>Connexion requise</h1>

    <button id="google-login"
      style="padding:12px 20px; border:1px solid #dadce0; border-radius:8px;
            background:white; font-size:16px; cursor:pointer; display:flex;align-items:center;">
        <img src="https://www.gstatic.com/images/branding/product/1x/gsa_64dp.png"
             style="width:20px;height:20px;margin-right:10px;">
        Se connecter avec Google
    </button>

<script>
document.getElementById("google-login").onclick = () => {
    window.location.href = "http://localhost:3000/auth/google";
};
</script>
</body>
</html>
